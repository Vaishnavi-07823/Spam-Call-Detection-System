<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .title-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #0f172a; }
      .title-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #64748b; }
      
      .center-node { fill: #1e293b; stroke: #0f172a; stroke-width: 2; rx: 12; }
      .category-card { rx: 6; stroke-width: 1.5; }
      .cat-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .cat-sig { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #475569; }
      .cat-token { font-family: 'Courier New', monospace; font-size: 10px; font-weight: 600; }
      
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
    <filter id="c-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" class="bg" />

  <!-- Header -->
  <rect x="40" y="20" width="1020" height="52" class="header-box" filter="url(#c-shadow)" />
  <text x="60" y="43" class="title-main">Figure 4: VoxShield AI Phone Scam Threat Taxonomy &amp; Vector Ontology</text>
  <text x="60" y="60" class="title-sub">Hierarchical Classification of Social Engineering Vectors, Acoustic Indicators, and Behavioral Triggers</text>

  <!-- Central Root Node -->
  <g transform="translate(450, 95)">
    <rect width="200" height="46" class="center-node" filter="url(#c-shadow)" />
    <text x="100" y="22" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">VOXSHIELD AI</text>
    <text x="100" y="37" font-family="Segoe UI, Arial" font-size="10.5" fill="#94a3b8" text-anchor="middle">Threat Taxonomy Root</text>
  </g>

  <!-- Connecting Trunk Lines -->
  <path d="M 550 141 L 550 165" class="line" />
  <path d="M 170 165 L 930 165" class="line" />
  <path d="M 170 165 L 170 180" class="line" />
  <path d="M 420 165 L 420 180" class="line" />
  <path d="M 680 165 L 680 180" class="line" />
  <path d="M 930 165 L 930 180" class="line" />

  <!-- ROW 1 (4 Core Major Fraud Vectors) -->

  <!-- Vector 1: Credential & Banking Theft -->
  <g transform="translate(40, 180)">
    <rect width="240" height="230" class="category-card" fill="#fef2f2" stroke="#ef4444" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#ef4444" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">1. Credential Theft</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Immediate financial drain</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 60 – 75 (High Critical)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#991b1b">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#b91c1c">• "OTP" (w=75)</text>
    <text x="15" y="124" class="cat-token" fill="#b91c1c">• "CVV Number" (w=75)</text>
    <text x="15" y="140" class="cat-token" fill="#b91c1c">• "UPI PIN" (w=75)</text>
    <text x="15" y="156" class="cat-token" fill="#b91c1c">• "Net Banking Password" (w=60)</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#7f1d1d">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Solicits temporary authorization tokens during live transaction initiation.</text>
  </g>

  <!-- Vector 2: Remote Access & Tech Support -->
  <g transform="translate(300, 180)">
    <rect width="240" height="230" class="category-card" fill="#fff7ed" stroke="#f97316" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#f97316" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">2. Tech Support / Remote</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Total device compromise</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 65 – 85 (High Critical)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#9a3412">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#c2410c">• "AnyDesk" (w=85)</text>
    <text x="15" y="124" class="cat-token" fill="#c2410c">• "TeamViewer" (w=85)</text>
    <text x="15" y="140" class="cat-token" fill="#c2410c">• "QuickSupport" (w=80)</text>
    <text x="15" y="156" class="cat-token" fill="#c2410c">• "Screen Share / Download APK"</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#7c2d12">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Guides victim to install remote desktop client to siphon credentials &amp; 2FA SMS.</text>
  </g>

  <!-- Vector 3: Authority Impersonation -->
  <g transform="translate(560, 180)">
    <rect width="240" height="230" class="category-card" fill="#faf5ff" stroke="#a855f7" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#a855f7" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">3. Authority Impersonation</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Coercion via legal fear</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 50 – 85 (High Threat)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#6b21a8">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#7e22ce">• "CBI / Police Thana" (w=80)</text>
    <text x="15" y="124" class="cat-token" fill="#7e22ce">• "Arrest Warrant / Girftari" (w=85)</text>
    <text x="15" y="140" class="cat-token" fill="#7e22ce">• "Narcotics / Illegal Parcel" (w=80)</text>
    <text x="15" y="156" class="cat-token" fill="#7e22ce">• "Customs / Court Case" (w=70)</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#581c87">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Digital arrest pretext; threatens imminent police raid unless security deposit is paid.</text>
  </g>

  <!-- Vector 4: Financial & Service Suspension -->
  <g transform="translate(820, 180)">
    <rect width="240" height="230" class="category-card" fill="#f0f9ff" stroke="#0284c7" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#0284c7" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">4. Financial &amp; Utility Fraud</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Fabricated urgency/loss</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 40 – 70 (Moderate-High)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#0369a1">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#0284c7">• "Account Blocked / Band" (w=70)</text>
    <text x="15" y="124" class="cat-token" fill="#0284c7">• "Electricity Bill Cut" (w=70)</text>
    <text x="15" y="140" class="cat-token" fill="#0284c7">• "Wire / Paisa Bhejo" (w=65)</text>
    <text x="15" y="156" class="cat-token" fill="#0284c7">• "Gift Card / Wire Transfer"</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#0c4a6e">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Claims essential utility or bank services will be terminated within minutes.</text>
  </g>

  <!-- ROW 2 Connecting Trunk Lines -->
  <path d="M 550 410 L 550 440" class="line" />
  <path d="M 170 440 L 930 440" class="line" />
  <path d="M 170 440 L 170 455" class="line" />
  <path d="M 420 440 L 420 455" class="line" />
  <path d="M 680 440 L 680 455" class="line" />
  <path d="M 930 440 L 930 455" class="line" />

  <!-- ROW 2 (4 Complementary Behavioral & Identity Vectors) -->

  <!-- Vector 5: Verification & KYC Scam -->
  <g transform="translate(40, 455)">
    <rect width="240" height="230" class="category-card" fill="#fdf4ff" stroke="#c026d3" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#c026d3" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">5. Verification / KYC Scam</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> PII &amp; Identity Harvest</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 40 – 60 (Moderate)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#86198f">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#a21caf">• "KYC Expiry" (w=60)</text>
    <text x="15" y="124" class="cat-token" fill="#a21caf">• "SIM Block / Deactivation" (w=60)</text>
    <text x="15" y="140" class="cat-token" fill="#a21caf">• "Aadhaar Card Linking" (w=40)</text>
    <text x="15" y="156" class="cat-token" fill="#a21caf">• "PAN Card Update" (w=45)</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#701a75">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Exploits regulatory compliance requirements to harvest sensitive identity numbers.</text>
  </g>

  <!-- Vector 6: Psychological Pressure Tactics -->
  <g transform="translate(300, 455)">
    <rect width="240" height="230" class="category-card" fill="#fffbeb" stroke="#f59e0b" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#f59e0b" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">6. Pressure &amp; Urgency Cues</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Cognitive overload</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 25 – 40 (Modifier)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#b45309">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#d97706">• "Immediately / Right now" (w=30)</text>
    <text x="15" y="124" class="cat-token" fill="#d97706">• "Within 10 minutes" (w=40)</text>
    <text x="15" y="140" class="cat-token" fill="#d97706">• "Abhi ke abhi / Turant" (w=40)</text>
    <text x="15" y="156" class="cat-token" fill="#d97706">• "Act fast / Expire" (w=35)</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#78350f">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Forces victim to act impulsively without verifying claims with family or bank.</text>
  </g>

  <!-- Vector 7: Lottery & Advance Fee Fraud -->
  <g transform="translate(560, 455)">
    <rect width="240" height="230" class="category-card" fill="#fefce8" stroke="#84cc16" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#65a30d" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">7. Lottery &amp; Prize Scams</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Advance processing fees</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Base Weight:</tspan> 50 – 75 (High)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#4d7c0f">Key Lexical Signatures:</text>
    <text x="15" y="108" class="cat-token" fill="#4d7c0f">• "You have won lottery" (w=75)</text>
    <text x="15" y="124" class="cat-token" fill="#4d7c0f">• "KBC Lucky Draw" (w=70)</text>
    <text x="15" y="140" class="cat-token" fill="#4d7c0f">• "Inaam jeeta" (w=75)</text>
    <text x="15" y="156" class="cat-token" fill="#4d7c0f">• "Registration Tax / Fee"</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#365314">Behavioral Hallmark:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Lures victim with nonexistent fortune, demanding upfront fee to release funds.</text>
  </g>

  <!-- Vector 8: Safe / Benign Baseline -->
  <g transform="translate(820, 455)">
    <rect width="240" height="230" class="category-card" fill="#ecfdf5" stroke="#10b981" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#10b981" />
    <text x="15" y="21" class="cat-title" fill="#ffffff">8. Safe / Legitimate Calls</text>
    <text x="15" y="50" class="cat-sig"><tspan font-weight="bold">Target:</tspan> Benign conversation</text>
    <text x="15" y="66" class="cat-sig"><tspan font-weight="bold">Risk Score:</tspan> 0 – 39 (Low Risk)</text>
    
    <text x="15" y="90" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#047857">Conversational Hallmark:</text>
    <text x="15" y="108" font-family="Segoe UI, Arial" font-size="10.5" fill="#334155">• Routine conversational dialogue</text>
    <text x="15" y="124" font-family="Segoe UI, Arial" font-size="10.5" fill="#334155">• Zero financial credential inquiries</text>
    <text x="15" y="140" font-family="Segoe UI, Arial" font-size="10.5" fill="#334155">• Absence of coercive threats</text>
    <text x="15" y="156" font-family="Segoe UI, Arial" font-size="10.5" fill="#334155">• Normal conversational pauses</text>

    <text x="15" y="180" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#064e3b">System Reaction:</text>
    <text x="15" y="196" font-family="Segoe UI, Arial" font-size="10" fill="#334155">Passive continuous monitoring without interrupting user experience.</text>
  </g>

</svg>
