<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .title-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #0f172a; }
      .title-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #64748b; }
      
      .panel { rx: 8; stroke-width: 1.5; }
      .panel-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .math-box { fill: #ffffff; rx: 5; stroke-width: 1; font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 13.5px; }
      .label-pill { rx: 10; font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; font-weight: 700; }
      
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      
      .badge-fast { fill: #dcfce7; stroke: #16a34a; }
      .badge-deep { fill: #f3e8ff; stroke: #9333ea; }
    </style>
    <marker id="arr-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arr-bl" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <filter id="p-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" class="bg" />

  <!-- Header -->
  <rect x="40" y="20" width="1020" height="52" class="header-box" filter="url(#p-shadow)" />
  <text x="60" y="43" class="title-main">Figure 3: Hybrid Threat Fusion Pipeline &amp; Max-Pooling Arbitration Model</text>
  <text x="60" y="60" class="title-sub">Mathematical Synthesis of Ultra-Fast Lexical Heuristics and Cognitive Semantic LLM Reasoning</text>

  <!-- Input Transcript Block -->
  <g transform="translate(40, 90)">
    <rect width="1020" height="60" class="panel" fill="#ffffff" stroke="#94a3b8" filter="url(#p-shadow)" />
    <text x="25" y="25" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#475569">STREAMING INPUT TRANSCRIPT (T)</text>
    <text x="25" y="45" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#1e293b">T = "Hello sir, this is CBI Officer Sharma, your SIM and bank account are blocked due to an illegal parcel. Share OTP now."</text>
  </g>

  <!-- Flow Split to Two Parallel Pipelines -->
  <path d="M 300 150 L 300 190" class="arrow-blue" marker-end="url(#arr-bl)" />
  <path d="M 800 150 L 800 190" class="arrow-blue" marker-end="url(#arr-bl)" />

  <!-- LEFT PANEL: Deterministic Rule-Based Analyzer -->
  <g transform="translate(40, 190)">
    <rect width="490" height="270" class="panel" fill="#f0fdf4" stroke="#22c55e" filter="url(#p-shadow)" />
    
    <!-- Title and Badge -->
    <text x="20" y="28" class="panel-title" fill="#14532d">Branch 1: Lexical Pattern Matching Engine</text>
    <rect x="360" y="12" width="110" height="22" class="label-pill badge-fast" />
    <text x="415" y="27" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">LATENCY: &lt; 5 ms</text>

    <!-- Formula 1: Weight Accumulation -->
    <rect x="20" y="48" width="450" height="52" class="math-box" stroke="#86efac" />
    <text x="35" y="70" fill="#1e293b">1. Lexical Scoring Function:</text>
    <text x="35" y="89" font-weight="bold" fill="#0f172a">S_rule(T) = min( 100,  ∑_{k_i ∈ M(T)} w(k_i) )</text>

    <!-- Formula 2: Category Assignment -->
    <rect x="20" y="110" width="450" height="52" class="math-box" stroke="#86efac" />
    <text x="35" y="132" fill="#1e293b">2. Primary Category Selection (ArgMax Frequency):</text>
    <text x="35" y="151" font-weight="bold" fill="#0f172a">C_rule(T) = argmax_{c}  ∑_{k_i ∈ M(T), cat(k_i)=c} w(k_i)</text>

    <!-- Exemplar Evaluation -->
    <rect x="20" y="172" width="450" height="82" rx="4" fill="#ffffff" stroke="#bbf7d0" />
    <text x="30" y="192" font-family="Segoe UI, Arial" font-size="11.5" font-weight="700" fill="#15803d">Runtime Trace for Sample T:</text>
    <text x="30" y="210" font-family="Segoe UI, Arial" font-size="11" fill="#334155">• Matched: "CBI" (w=80), "bank account" (w=40), "blocked" (w=45), "otp" (w=75)</text>
    <text x="30" y="228" font-family="Segoe UI, Arial" font-size="11" fill="#334155">• Raw Total: 80 + 40 + 45 + 75 = 240  ⟶  Capped Rule Score: <tspan font-weight="bold" fill="#dc2626">S_rule = 100</tspan></text>
    <text x="30" y="244" font-family="Segoe UI, Arial" font-size="11" fill="#334155">• Primary Category: <tspan font-weight="bold">"Impersonation" (w=80)</tspan></text>
  </g>

  <!-- RIGHT PANEL: Gemini LLM Cognitive Engine -->
  <g transform="translate(570, 190)">
    <rect width="490" height="270" class="panel" fill="#faf5ff" stroke="#a855f7" filter="url(#p-shadow)" />
    
    <!-- Title and Badge -->
    <text x="20" y="28" class="panel-title" fill="#581c87">Branch 2: Cognitive LLM Semantic Engine</text>
    <rect x="345" y="12" width="125" height="22" class="label-pill badge-deep" />
    <text x="407" y="27" font-family="Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#7e22ce" text-anchor="middle">TIMEOUT: 6000 ms</text>

    <!-- Formula 1: Generative Inference -->
    <rect x="20" y="48" width="450" height="52" class="math-box" stroke="#d8b4fe" />
    <text x="35" y="70" fill="#1e293b">1. Contextual Semantic Inference (Gemini 1.5 Flash):</text>
    <text x="35" y="89" font-weight="bold" fill="#0f172a">⟨ S_AI, C_AI, R_AI, G_AI ⟩ = M_LLM( Prompt(T), Schema_JSON )</text>

    <!-- Formula 2: Circuit Breaker Fallback -->
    <rect x="20" y="110" width="450" height="52" class="math-box" stroke="#d8b4fe" />
    <text x="35" y="132" fill="#1e293b">2. Asynchronous Circuit Breaker Logic:</text>
    <text x="35" y="151" font-weight="bold" fill="#0f172a">S_AI = ( Δt ≤ 6000ms &amp;&amp; Valid(Resp) ) ? S_resp : S_rule</text>

    <!-- Exemplar Evaluation -->
    <rect x="20" y="172" width="450" height="82" rx="4" fill="#ffffff" stroke="#e9d5ff" />
    <text x="30" y="192" font-family="Segoe UI, Arial" font-size="11.5" font-weight="700" fill="#7e22ce">Structured JSON Output Trace:</text>
    <text x="30" y="210" font-family="Segoe UI, Arial" font-size="11" fill="#334155">• <tspan font-weight="bold">riskScore:</tspan> 95 | <tspan font-weight="bold">category:</tspan> "impersonation"</text>
    <text x="30" y="226" font-family="Segoe UI, Arial" font-size="11" fill="#334155">• <tspan font-weight="bold">reason:</tspan> "False authority claim + urgent coercion to extract OTP credential"</text>
    <text x="30" y="242" font-family="Segoe UI, Arial" font-size="11" fill="#334155">• <tspan font-weight="bold">suggestion:</tspan> "End call immediately. Police/CBI never demand OTP on call."</text>
  </g>

  <!-- Connectors to Arbitration Bottom Panel -->
  <path d="M 285 460 L 285 500 L 490 500" class="arrow" marker-end="url(#arr-m)" />
  <path d="M 815 460 L 815 500 L 610 500" class="arrow" marker-end="url(#arr-m)" />

  <!-- BOTTOM PANEL: Maximum-Pooling Arbitration & Tri-Tier Threat Mapping -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="155" class="panel" fill="#fff7ed" stroke="#ea580c" filter="url(#p-shadow)" />
    
    <text x="25" y="26" class="panel-title" fill="#9a3412">Tier 3: Max-Pooling Threat Arbitration &amp; Actionable Policy Mapping</text>

    <!-- Equation 1 -->
    <rect x="25" y="42" width="340" height="95" class="math-box" stroke="#fdba74" />
    <text x="40" y="65" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#9a3412">FUSION SCORING RULE</text>
    <text x="40" y="87" font-size="15" font-weight="bold" fill="#0f172a">S_final = max( S_rule,  S_AI )</text>
    <text x="40" y="108" font-size="11" fill="#475569">Sample: max( 100, 95 ) = <tspan font-weight="bold" fill="#dc2626">100 (Extreme Threat)</tspan></text>
    <text x="40" y="124" font-size="10" fill="#64748b">Ensures zero-miss for known attack keywords</text>

    <!-- Tri-tier Spectrum visualization -->
    <rect x="385" y="42" width="610" height="95" rx="5" fill="#ffffff" stroke="#fed7aa" />
    <text x="405" y="63" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#475569">TRI-TIER THREAT CLASSIFICATION SPECTRUM</text>

    <!-- Zone 1 -->
    <rect x="405" y="75" width="180" height="50" rx="4" fill="#dcfce7" stroke="#22c55e" />
    <text x="495" y="94" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">SAFE ZONE [0 - 39]</text>
    <text x="495" y="112" font-family="Segoe UI, Arial" font-size="10" fill="#166534" text-anchor="middle">Passive Monitoring / Legitimate</text>

    <!-- Zone 2 -->
    <rect x="600" y="75" width="180" height="50" rx="4" fill="#fef9c3" stroke="#eab308" />
    <text x="690" y="94" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#a16207" text-anchor="middle">SUSPICIOUS [40 - 70]</text>
    <text x="690" y="112" font-family="Segoe UI, Arial" font-size="10" fill="#854d0e" text-anchor="middle">Caution Advisory / Verification</text>

    <!-- Zone 3 -->
    <rect x="795" y="75" width="180" height="50" rx="4" fill="#fee2e2" stroke="#ef4444" />
    <text x="885" y="94" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">CRITICAL SCAM [&gt; 70]</text>
    <text x="885" y="112" font-family="Segoe UI, Arial" font-size="10" fill="#991b1b" text-anchor="middle">Immediate Hang-Up Alert</text>
  </g>

</svg>
